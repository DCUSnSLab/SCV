# ============================================================================
#  anchor_fusion.yaml — 계층형 앵커링 파이프라인 (gps_measurement_node + anchor_manager_node)
#  FGO(fgo_fusion.yaml) 대체안. 설계 논의 2026-08-24:
#    RTK 주 소스(가용률 ~60% 가정) / RTK 상실 시 검증된 PCD 만 이벤트성 앵커 /
#    float GPS 는 봉투 검증 전용 / 동시 공백은 odom 신뢰 + 드리프트 예산 -> DEGRADED.
#  RTK 구간에도 PCD 연산은 유지하며 RTK 기준 신뢰 캘리브레이션을 상시 수행.
# ============================================================================
gps_measurement:
  ros__parameters:
    topics:
      gps: "/ublox_gps_node/fix"
      measurement: "/gps/measurement"
      coarse_position: "/gps/coarse_position"   # PCD BBS 전역초기화 prior (기존 규약)
      fix_state: "/gps/fix_state"
    frames:
      map: "map"
    map_origin:
      # record_20260714_150909 첫 GNSS 샘플 (fgo_fusion.yaml 과 동일 datum)
      easting: 482278.2382001437
      northing: 3974410.5352799334
      utm_zone: 52
      northern_hemisphere: true
    gps:
      rtk_status_min: 2
      rtk_sigma_max: 0.05
      rtk_sigma_floor: 0.05
      float_sigma_floor: 1.5
      unknown_sigma: 5.0

anchor_manager:
  ros__parameters:
    topics:
      odom: "/odom"
      gps_measurement: "/gps/measurement"
      pcd_global_pose: "/pcd/global_pose"
      map_to_odom: "/localization/map_to_odom"  # 기존 토픽명 유지 (하위 호환)
      global_pose: "/global_pose"
      status: "/anchor/status"                  # DEGRADED 문자열은 FGO 규약과 동일
      trust: "/anchor/pcd_trust"                # [n, p95_xy, p95_yaw, ok]
      budget: "/anchor/drift_budget"            # [m]
    frames:
      map: "map"
      odom: "odom"
      base_link: "base_link"
    publish_tf: true
    status_rate_hz: 5.0
    tf_rate_hz: 50.0         # map->odom TF 재스탬프 주기 (tf2 공통시각 유지)
    slew:                    # 앵커 갱신 점프의 슬루 제한 (제어기 조향 충격 방지)
      max_m_per_s: 0.5
      max_rad_per_s: 0.2

    rtk:                     # map->odom (x,y,θ) 3-상태 EKF
      sigma_floor: 0.05      # m
      gate_chi2: 9.21        # 2-DoF 99% (이상 RTK 게이트)
      # GPS 안테나의 base_link 기준 수평 레버암 [m]. 미보상 시 그 크기만큼 계통오차
      # (A/B 재생 실측: FGO-RTK 잔차 0.22m ≈ 레버암). 로봇 실측값으로 채울 것.
      antenna_offset_x: 0.0
      antenna_offset_y: 0.0
      # map->odom 이 흐르는 속도 = odom 드리프트 (랜덤워크 σ/√s)
      process_xy_sigma: 0.03
      process_yaw_sigma: 0.002
      fresh_sec: 1.0         # RTK 측정 공백 허용 (이탈 디바운스)
      recover_sec: 3.0       # 연속 수신 요구 (진입 디바운스, 플래핑 방어)
      yaw_init_min_travel: 2.0   # RTK 단독 초기화: 이동방향 yaw 추정 최소 주행거리

    trust:                   # RTK 구간의 PCD 채점 (RTK=참값)
      window_sec: 120.0
      min_samples: 10
      # 실측 (eval_fgo_20260721, RTK 겹침 455표본): PCD-RTK 2D 오차
      # mean=0.35 p95=0.60 max=0.64 — 안테나-라이다 오프셋 ~0.2m 미보상 포함.
      # 0.5 로 두면 정상 PCD 도 "불신" 판정 -> p95 실측 + 여유로 0.7.
      xy_max: 0.7            # m (윈도우 p95 상한)
      yaw_max: 0.05          # rad

    vote:                    # PCD 앵커 시간 일관성 (BBS 투표와 동일 패턴)
      required: 3            # 신뢰 캘리브레이션 양호 시
      required_uncalibrated: 5
      xy_tol: 0.5
      yaw_tol: 0.035         # ~2 deg
      timeout_sec: 5.0

    float_envelope:          # float GPS = 앵커 아님, PCD 대실패(수 m 오정합) 검출용
      fresh_sec: 2.0
      sigma_scale: 3.0
      margin: 2.0            # m

    budget:                  # 드리프트 예산 (절대측정 공백 회계)
      drift_rate_m_per_min: 0.5    # ESKF 실측 드리프트율
      step_gate_margin: 0.5        # 허용 스텝 = 예산 + 이 여유
      large_step_confirmations: 6  # 스텝 초과 수락(재획득)에 요구되는 합의 수
      max_m: 1.5                   # 예산 소진 -> DEGRADED
      pcd_active_window_sec: 10.0  # 절대 갱신이 이 이내면 PCD_ACTIVE 표시
