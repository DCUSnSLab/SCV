/**:
  ros__parameters:
    input_topic: "/lio_sam/feature/cloud_info"
    prior_odom_topic: "/odom"
    initial_pose_topic: "/initialpose"
    global_pose_topic: "/pcd/global_pose"
    map_to_odom_candidate_topic: "/pcd/map_to_odom"
    processing_enable_topic: "/localization/pcd_enabled"

    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    lidar_frame: "velodyne"

    # Bundle PCDs are already in the map frame (map_generator applies georef), so identity.
    map_native_to_map:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw_deg: 0.0

    use_prior_odom: true
    prior_pose_is_base_frame: true
    initial_pose_is_base_frame: true
    require_initial_pose: true
    require_initial_pose_without_prior: true
    processing_enabled_at_start: false
    use_constant_velocity_guess: true
    prior_timeout_sec: 0.5

    global_initialization:
      # Cold start only. A rough GPS x/y bounds translation when available;
      # BBS still searches all yaw. Without a fresh position prior it retains
      # the existing full x/y/yaw search. IMU supplies roll/pitch, then a short
      # 1-D pass estimates z before the existing 6-DoF refinement.
      enabled: true
      position_prior_topic: "/gps/coarse_position"
      position_prior_max_age_sec: 1.0
      # Search radius is clamp(3 * reported GPS sigma, 10 m, 30 m).
      position_prior_sigma_scale: 3.0
      position_prior_min_radius: 10.0
      position_prior_max_radius: 30.0
      # 2026-08-20: 사전정보를 "만료됐다"고 버리지 않는다. 이 콜백이 BBS 로
      # 실행기를 ~1.08 초 독점하는 동안 GPS 사전정보가 큐에서 못 빠져나와
      # max_age(1.0 s)를 항상 넘긴다 -> 자기 기아. 실측 69/69 회가 radius=0 으로
      # 660x557 m 전체를 1 초에 뒤졌고 초기화 성공 0 회였다.
      # 대신 나이만큼 반경을 키워서 쓴다: +age * speed_margin (max_radius 로 clamp).
      position_prior_stale_limit_sec: 10.0
      position_prior_speed_margin: 3.0
      # The LiDAR callback itself limits attempts to sensor rate. Three
      # consistent votes normally complete in well under one second.
      retry_interval_sec: 0.0
      min_corner_points: 15
      required_votes: 3
      max_votes: 6
      vote_xy_tolerance: 1.0
      vote_yaw_tolerance_deg: 5.0
      # 2026-08-19: 2.0 -> 4.0. BBS 1회가 느려져 투표 간격이 timeout 을 넘으면
      # 매번 리셋돼 영원히 합의 불가(무음 마비). 앵커가 odom 상대(map_to_prior)라
      # 창을 늘려도 이동 오차는 수 cm 수준 -> 안전.
      vote_timeout_sec: 4.0
      # BBS match 1회 시간 예산 [s] (0=무제한). 예산 도달 시 best-so-far 반환.
      max_match_seconds: 1.0
      resolution: 0.5
      score_sigma: 0.75
      score_cutoff: 2.25
      map_padding: 5.0
      yaw_step_deg: 1.0
      branch_and_bound_depth: 6
      min_score: 0.25
      min_scan_range: 2.0
      max_scan_range: 50.0
      max_scan_points: 300
      z_center: 0.0
      use_prior_z: true
      z_half_range: 4.0
      z_step: 0.25
      z_score_sigma: 0.75
      z_score_cutoff: 2.25

    relocalization:
      enabled: true
      # 짧은 정합 실패는 기존 추적기가 먼저 회복하고, 이 시간이 지나면 BBS를 시작한다.
      start_after_sec: 2.0
      retry_interval_sec: 0.1
      # odom이 정상이면 중심은 odom 예측 위치를 따르고 반경은
      # 초기 반경 + 누적 odom 거리 * 거리당 오차 상한으로 확장한다.
      xy_initial_radius_m: 2.0
      xy_error_per_odom_meter: 0.35
      # 도중에 odom까지 끊기거나 아래 물리 한계를 넘으면 마지막 정상 odom 위치를 유지하고,
      # 그때까지의 반경 + 차량 최대 속도 * odom 손실 시간으로 확장한다.
      # PCD 손실 시점부터 유효한 odom이 없었을 때만 마지막 PCD 위치를 중심으로 사용한다.
      max_vehicle_speed_mps: 2.0
      odom_jump_tolerance_m: 0.5
      max_odom_yaw_rate_deg_per_sec: 60.0
      odom_yaw_jump_tolerance_deg: 5.0
      # 타임스탬프 역행과 급격한 위치·yaw 점프는 위 한계로 검출한다.
      # 물리 한계 안에서 서서히 반대 방향으로 틀리는 odom은 단독으로 판별할 수 없으며,
      # 이 경우에는 BBS 실패와 외부 위치 기준 또는 안전 정지로 판단해야 한다.
      # 이 반경부터 Lost를 알린다. 모드 관리자는 마지막 map->odom을 Hold한다.
      xy_stop_radius_m: 20.0
      # 설정은 deg, C++ 내부 계산은 rad이다. odom/IMU 예측 yaw를 중심으로 범위를 확장한다.
      yaw_initial_half_range_deg: 15.0
      yaw_growth_deg_per_sec: 5.0
      # 2026-08-19: 180 -> 45. 반경 20m 원 안에서 odom yaw 가 45도 이상 틀리는
      # 시나리오는 없고(위 yaw rate 한계로 검출), 전방위 탐색은 BBS 1회 비용을
      # 분 단위로 키워 재초기화 루프 전체를 마비시켰다 (DCU bag 재현).
      yaw_max_half_range_deg: 45.0

    map_corner_leaf: 0.2
    map_surf_leaf: 0.4
    scan_corner_leaf: 0.2
    scan_surf_leaf: 0.4
    edge_min_valid: 10
    surf_min_valid: 100
    max_iterations: 20
    max_step_xy: 3.0

    use_local_map_window: true
    # 2026-08-19: 35 -> 25. scan_match 500ms+ (10Hz 예산 100ms 5배 초과)로
    # 처리율이 2~3Hz 로 떨어져 커브에서 rejected_max_iterations 유발.
    # 면적비 0.51 로 창 포인트 절반 -> 정합/재구축 비용 절감.
    local_map_radius: 25.0
    local_map_rebuild_dist: 5.0
    min_local_corner_points: 200
    min_local_surf_points: 1000

    lookup_backend: "cuda"
    profile_timings: true
    max_consecutive_failures: 5
    imu_rpy_weight: 0.01

    publish_tf: false
    publish_map_to_odom: false
    publish_map_features: false
    publish_registered_cloud: false
