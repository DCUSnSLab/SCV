# ============================================================================
#  local_odometry_real.yaml  —  실환경 bag / 실제 로봇용
#  대상: Hunter SE + VN-100 IMU, record_20260630_141417 계열 bag
#  sim 과 다른 핵심: wheel_scale (LIO-SAM 참거리 보정), imu_extrinsic (실장착 회전)
#  → 시뮬용은 local_odometry_sim.yaml
# ============================================================================
/**:
    ros__parameters:
        topics:
            imu: "/vectornav/imu"          # sensor_msgs/Imu (100Hz)
            speed: "/hunter/velocity"      # std_msgs/Float64, 전진 속도 [m/s]
            output_odom: "/odom"           # nav_msgs/Odometry 출력

        frames:
            odom: "odom"                   # local 프레임 (로봇 켠 지점)
            base_link: "base_link"         # 로봇 몸체
        publish_tf: true                   # odom->base_link 발행 (map->odom 은 발행 안 함)

        estimator: "eskf"                  # "eskf"(15-state, 기본) | "gyro_odometry"(2D baseline, 비교용)
        use_imu_orientation: false         # (gyro_odometry용) false: 자이로 z 적분, true: IMU 절대 yaw
        max_dt: 0.5

        # [REAL] 오프라인 보정. record_20260630=0.923(LIO-SAM), record_20260714=tiny 대비 2.4% 과다
        #   -> 0.90 으로 조정 (여러 bag 평균으로 재확정 권장; tiny 도 완벽 참값은 아님)
        wheel_scale: 0.90

        # [REAL] base_link <- imu(vectornav) 실제 장착 회전 [rad]. URDF/tf_static 값으로 채울 것.
        imu_extrinsic:
            roll: 0.0
            pitch: 0.0
            yaw: 0.0

        # ESKF 노이즈/임계 (estimator: eskf 일 때). grid search 튜닝값. 재컴파일 없이 여기서 조정.
        eskf:
            planar: true                 # z 위치·수직속도를 0으로 pin (지상 로봇 평면 구속)
            stationary_hold: true        # 정지 확정 시 pose 홀드(적분 중단) -> at-rest 드리프트 0
            zaru_enable: true            # [REAL] VN-100 실제 자이로 바이어스 존재 -> ZARU 켬 (sim 은 끔)
            # 프로세스 노이즈
            gyro_noise: 0.000061         # rad/s/sqrt(Hz) (VN-100 density)
            # [REAL] 실측 accel std=1.17 m/s^2(record_20260714, 진동+전이 최대 6.3)에 맞춤.
            #   0.05 로 두면 가속도를 24배 과신 -> 회전 등 동적구간에서 위치 순간 스파이크(튐).
            #   1.0 으로 올려 속도 예측 불확실성 반영 -> 휠이 속도 지배, 스파이크 제거.
            accel_noise: 1.0
            gyro_bias_rw: 0.00001
            accel_bias_rw: 0.0001
            # 측정 노이즈 (stddev)
            wheel_speed_sigma: 0.1       # 휠 전진속도
            nhc_sigma: 0.03              # 비홀로노믹 측/수직 (작을수록 측면미끄러짐 억제 강함)
            zupt_vel_sigma: 0.01         # 정지 시 속도=0 (tight)
            zaru_sigma: 0.005            # 정지 시 각속도=0 (자이로 bias 보정)
            # 정지 판정 (ZUPT/ZARU) 3중 조건
            zupt_speed_thresh: 0.05      # m/s
            zupt_gyro_thresh: 0.02       # rad/s
            zupt_acc_var_thresh: 0.05    # accel-norm 분산
            stationary_window: 20        # accel 분산 윈도우 샘플수
