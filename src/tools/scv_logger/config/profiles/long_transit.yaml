# SCV Logger 녹화 프로파일 — GUI(프로파일 탭)에서 저장하면 이 파일이 다시 쓰인다.
# extends로 부모를 지정하면 부모와의 차이만 적는다.
name: long_transit
description: 실내↔실외 이동 같은 긴 구간 — drive_standard에서 카메라 제외, zstd 압축
extends: drive_standard
exclude_groups:
- camera_compressed
- camera_info
options:
  compression: zstd
  split_duration_sec: 600
