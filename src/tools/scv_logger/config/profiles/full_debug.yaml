# SCV Logger 녹화 프로파일 — GUI(프로파일 탭)에서 저장하면 이 파일이 다시 쓰인다.
# extends로 부모를 지정하면 부모와의 차이만 적는다.
name: full_debug
description: 짧은 문제 재현 — 원본 카메라 포함 카탈로그 전부 (분당 수 GB)
extends: base
groups:
- lidar
- lidar_points
- camera_info
- camera_compressed
- camera_raw
- imu_gnss
- vehicle
- localization
- planning
- control
- tf
options:
  split_duration_sec: 60
