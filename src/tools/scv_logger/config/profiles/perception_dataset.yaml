# SCV Logger 녹화 프로파일 — GUI(프로파일 탭)에서 저장하면 이 파일이 다시 쓰인다.
# extends로 부모를 지정하면 부모와의 차이만 적는다.
name: perception_dataset
description: 학습·라벨링용 데이터 수집 — 카메라 원본, LiDAR 패킷(녹화 후 포인트 변환), TF, 위치 (매우 큼)
extends: base
add_groups:
- lidar_points
- camera_info
- camera_compressed
- imu_gnss
- vehicle
- control
- tf
topics:
- /front/scan
- /rear/scan
options:
  split_duration_sec: 120
