/**:
  ros__parameters:
    # transport comes from the launch file.
    grid_frame: map
    base_frame: base_link
    tf_timeout_sec: 0.1
    resolution: 0.1
    size_cells: 200
    min_height: 0.2
    max_height: 1.8
    # Insert p50 2.7 ms per VLP-32C scan against 12.5 ms at stride 1 (bench_grid_insert, one i7-14700K core).
    clear_stride: 5
    self_box:
      min_x: -0.5
      max_x: 0.6
      min_y: -0.43
      max_y: 0.43
