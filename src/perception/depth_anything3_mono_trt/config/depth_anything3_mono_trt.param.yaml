/**:
  ros__parameters:
    tensorrt:
      # The precision is the one of the ONNX file: FP32, FP16 or INT8 (Q/DQ nodes).
      onnx_path: ""
      # Built from onnx_path on the first start when missing; build_engine builds it ahead.
      engine_path: ""
      workspace_mb: 2048
      # TF32 moved a yolo26n-seg score by 0.012 against ONNX Runtime for 3 % speed (trtexec,
      # RTX 3060): off, so that results match the reference.
      tf32: false
      # The TensorRT default.
      optimization_level: 3
      # Empty: no timing cache.
      timing_cache_path: ""
      # -1: GPU only. 0 or 1: a DLA core of Orin, the rest on the GPU.
      dla_core: -1
    # gpu: resize (area when shrinking, cubic when enlarging) and normalize in a CUDA kernel.
    # cpu: OpenCV, the reference of the kernel test.
    preprocess: gpu
    # A 2208x1242 32FC1 depth image is 10.5 MiB.
    output_slot_mb: 12
    # true for DA3METRIC: meters from ~/input/camera_info. false for DA3MONO: relative depth.
    metric: true
    # The parameters below may change while the node runs (ros2 param set).
    # compute_sky_mask in depth_anything_3/utils/alignment.py.
    sky_threshold: 0.3
    # inf: the sky is +inf, "too far" in REP 118, so a costmap reads it as free. fill: the
    # sky_quantile of the ground depth, at most sky_depth_cap, as Depth Anything 3 does.
    sky_mode: inf
    # _process_mono_sky_estimation in depth_anything_3/model/da3.py.
    sky_quantile: 0.99
    # The cap of ika-rwth-aachen/ros2-depth-anything-v3-trt; Depth Anything 3 has none.
    sky_depth_cap: 200.0
    point_cloud:
      # Needs ~/input/camera_info.
      enabled: true
      # Every n-th pixel in both directions.
      downsample: 2
      colorize: true
      # 1280x720 at downsample 2 with color is 3.5 MiB. Start only.
      slot_mb: 8
