/**:
  ros__parameters:
    tensorrt:
      # Relative paths are in the models/ directory of this package. On the first start the node
      # downloads the Ultralytics model, exports onnx_path and builds engine_path from it, each
      # only when missing. Rename onnx_path and engine_path with model or half: files that exist
      # are used as they are.
      model: "yolo26n-depth.pt"
      # Export in FP16: faster on Orin, and the results move against the FP32 reference.
      half: false
      # The precision is the one of the ONNX file: FP32, FP16 or INT8 (Q/DQ nodes).
      onnx_path: "yolo26n-depth.onnx"
      engine_path: "yolo26n-depth.engine"
      workspace_mb: 1024
      # TF32 moved a yolo26n-seg score by 0.012 against ONNX Runtime for 3 % speed (trtexec,
      # RTX 3060): off, so that results match the reference.
      tf32: false
      # The TensorRT default.
      optimization_level: 3
      # Empty: no timing cache.
      timing_cache_path: ""
      # -1: GPU only. 0 or 1: a DLA core of Orin, the rest on the GPU.
      dla_core: -1
    # gpu: resize and normalize in a CUDA kernel. cpu: OpenCV, the reference of the kernel test.
    preprocess: gpu
    # The parameters below may change while the node runs (ros2 param set).
    point_cloud:
      # Needs ~/input/camera_info.
      enabled: true
      # Every n-th pixel in both directions.
      downsample: 2
      colorize: true
