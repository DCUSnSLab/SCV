[flake8]
# Only the classes that name a defect. The pydocstyle D4xx opinions (imperative mood, trailing
# period) contradict how this project writes prose, and enforcing them would be churn, not review.
select = F,E9,C4,E7
extend-ignore = E741,B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,CNL100,E203,E501,Q000
import-order-style = pep8
max-line-length = 100
exclude = thirdparty,build,install,log
show-source = true
statistics = true

[isort]
profile=black
line_length=100
force_sort_within_sections=true
force_single_line=true
reverse_relative=true
known_third_party=launch
