# SCV ROS 2 Humble 개발 컨테이너
# 사용법은 docker/README.md 참고
services:
  scv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: scv
        # 호스트 UID/GID (필요 시 .env 또는 export 로 덮어쓰기)
        USER_UID: ${HOST_UID:-1001}
        USER_GID: ${HOST_GID:-1002}
    image: scv:humble
    container_name: scv
    hostname: scv-dev
    stdin_open: true
    tty: true

    # ROS 2 DDS 디스커버리 및 센서 통신을 위해 호스트 네트워크 사용
    network_mode: host
    ipc: host

    # NVIDIA GPU (RViz/Gazebo 가속, perception)
    gpus: all

    # LiDAR(USB/이더넷), CAN, GNSS/IMU 시리얼 등 실센서 디바이스 접근
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    volumes:
      # 워크스페이스(저장소 루트)를 /ws 로 마운트 - 호스트에서 편집, 컨테이너에서 빌드
      - ../:/ws:rw
      # GUI(RViz/RQt) 출력용 X11 소켓
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # 디바이스 핫플러그/USB
      - /dev:/dev

    working_dir: /ws
